name: Validate pt-BR translation
on:
  push:
    branches: [ci/validate-8681e668-20261116-a73c9b]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ptbr-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply patch
        run: |
          cat .toqi-ptbr-validation-20261116/part-*.b64 | base64 -d | gzip -d > "$RUNNER_TEMP/ptbr.patch"
          echo 'e422802d8f56d4ca34bb53ca953949dc489559433732dfcd7b0376694d62a4e8  '"$RUNNER_TEMP/ptbr.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/ptbr.patch"
          git apply --index "$RUNNER_TEMP/ptbr.patch"
      - name: Publish translated source to test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply Brazilian Portuguese translation for validation'
          git push origin HEAD:refs/heads/ci/validate-8681e668-20261116-a73c9b
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply patch
        run: |
          cat .toqi-ptbr-validation-20261116/part-*.b64 | base64 -d | gzip -d > "$RUNNER_TEMP/ptbr.patch"
          echo 'e422802d8f56d4ca34bb53ca953949dc489559433732dfcd7b0376694d62a4e8  '"$RUNNER_TEMP/ptbr.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/ptbr.patch"
          git apply "$RUNNER_TEMP/ptbr.patch"
      - name: Install pinned Rust
        working-directory: src
        run: rustup toolchain install
      - name: Caption formatting tests
        working-directory: src
        run: |
          rustc --test crates/capcraft-android/src/caption_text.rs -o "$RUNNER_TEMP/caption-tests"
          "$RUNNER_TEMP/caption-tests"
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      GGML_NATIVE: "OFF"
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply patch
        run: |
          cat .toqi-ptbr-validation-20261116/part-*.b64 | base64 -d | gzip -d > "$RUNNER_TEMP/ptbr.patch"
          echo 'e422802d8f56d4ca34bb53ca953949dc489559433732dfcd7b0376694d62a4e8  '"$RUNNER_TEMP/ptbr.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/ptbr.patch"
          git apply "$RUNNER_TEMP/ptbr.patch"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - name: Install Rust and Android target
        working-directory: src
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
      - name: Install cargo-ndk and NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build FFmpeg
        run: src/scripts/ffmpeg-mobile.sh aarch64-linux-android
      - name: Prepare sherpa-onnx
        run: src/scripts/sherpa-mobile.sh aarch64-linux-android
      - name: Assemble debug APK and run Android unit tests
        run: |
          cd src
          eval "$(scripts/mobile-env.sh aarch64-linux-android)"
          cd crates/capcraft-android/android
          ./gradlew assembleDebug testDebugUnitTest -Pcapcraft.abis=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: capcraft-ptbr-debug-arm64
          path: src/crates/capcraft-android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
